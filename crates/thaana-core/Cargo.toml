[package]
name = "thaana-core"
version = "0.1.0"
description = "Reads correctly ordered Dhivehi (Thaana) text, with tables, out of typed PDFs."
license = "Apache-2.0"
edition = "2024"

[dependencies]
hayro = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif"] }
lopdf = { version = "0.47.0", default-features = false }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
