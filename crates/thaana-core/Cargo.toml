[package]
name = "thaana-core"
version = "0.1.0"
description = "Reads correctly ordered Dhivehi (Thaana) text, with tables, out of typed PDFs."
license = "Apache-2.0"
edition = "2024"

[dependencies]
lopdf = { version = "0.47.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
