[package]
name = "thaana-pdf-to-word"
version = "0.4.0"
description = "Turn Dhivehi (Thaana) PDFs and scans into editable text and Word files."
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
thaana-core = { version = "0.1.0", path = "../crates/thaana-core" }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[features]
# Test hooks for test/tauri-smoke.mjs (never in release builds people download)
smoke = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
