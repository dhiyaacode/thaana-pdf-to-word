# Builds the app for Windows and macOS (Apple chip and Intel) and attaches the
# installers (and a portable Windows .zip) to a draft release. Run it from the Actions tab, or push a tag such as v0.4.0.
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: 'Thaana PDF to Word ${{ github.ref_type == ''tag'' && github.ref_name || format(''build {0}'', github.run_number) }}'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
      # Portable Windows version: the app's .exe holds the whole interface and the reading
      # models, so on its own it runs from any folder without installing.
      - name: Attach portable Windows version
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/thaana-pdf-to-word.exe 'portable/Thaana PDF to Word.exe'
          $zip = "Thaana.PDF.to.Word_${v}_x64-portable.zip"
          Compress-Archive -Path 'portable/Thaana PDF to Word.exe' -DestinationPath $zip -CompressionLevel Optimal
          gh release upload $env:TAG $zip --clobber
